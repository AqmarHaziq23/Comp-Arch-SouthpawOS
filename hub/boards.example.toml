# Copy to boards.toml. Boards are matched by address only.
# Each board's firmware sets its own fixed address (BLE_PUBLIC_ADDR), so these
# stay the same after power cycles and reflashes, and on every Pi or laptop.
[boards]
wristL = "02:80:E1:50:31:4C"   # P1D-WRIST-L
wristR = "02:80:E1:50:31:52"   # P1D-WRIST-R
bag    = "02:80:E1:50:31:42"   # P1D-BAG
